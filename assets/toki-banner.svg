</g>
<svg x="34" y="34" width="240" height="173" viewBox="0 0 50 36"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2s" repeatCount="indefinite"/><path d="M11 13 l-2 -7 l7 4 z" fill="#d9788a"/><path d="M37 13 l2 -7 l-7 4 z" fill="#d9788a"/><ellipse cx="24" cy="22" rx="16" ry="13" fill="#f29aa8"/><rect x="19" y="8.5" width="10" height="2" rx="1" fill="#d9788a"/><circle cx="24" cy="6" r="3" fill="#f4c35b" stroke="#b98d2e" stroke-width="0.8"><animate attributeName="cy" values="2;8;8" dur="1.2s" repeatCount="indefinite"/></circle><rect x="13" y="32" width="5" height="3.5" rx="1.5" fill="#d9788a"/><rect x="30" y="32" width="5" height="3.5" rx="1.5" fill="#d9788a"/><ellipse cx="24" cy="24.5" rx="5" ry="3.6" fill="#d9788a"/><circle cx="22.3" cy="24.5" r="0.9" fill="#2b2b2b"/><circle cx="25.7" cy="24.5" r="0.9" fill="#2b2b2b"/><path d="M15 20 q3 -3 6 0" stroke="#2b2b2b" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M27 20 q3 -3 6 0" stroke="#2b2b2b" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M20 28 q4 4 8 0" stroke="#d9788a" stroke-width="1.6" fill="none" stroke-linecap="round"/></g><path d="M38 8 l3 3 l6 -6" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
